name: Shopeo checks
on:
  push:
    branches: [main, "codex/**"]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: shopeo
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: shopeo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shopeo -d shopeo"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SHOPEO_TEST_DATABASE_URL: postgresql+psycopg://shopeo:ci-only-password@127.0.0.1:5432/shopeo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: npm ci --no-audit --no-fund
      - run: pip install -r api/requirements.txt
      - name: Prepare isolated PostgreSQL test database
        run: |
          python -c "import psycopg; c=psycopg.connect('postgresql://shopeo:ci-only-password@127.0.0.1:5432/shopeo',autocommit=True); c.execute('CREATE DATABASE shopeo_test'); c.close()"
      - run: python -m pytest
        working-directory: api
      - run: npm run typecheck
      - run: npm run build
