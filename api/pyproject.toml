[project]
name = "shopeo-api"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "SQLAlchemy==2.1.8",
  "alembic==1.20.1",
  "psycopg[binary]==3.3.8",
  "argon2-cffi==25.1.0",
  "pyotp==2.10.0",
  "email-validator==2.3.0",
  "httpx==0.28.1",
  "cryptography==50.0.2",
]

[tool.vercel]
entrypoint = "index:app"

[tool.vercel.scripts]
build = "python build.py"
